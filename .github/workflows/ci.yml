name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# 同一分支的新提交取消上一次运行，避免排队的旧任务占 runner
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  PYTHONUNBUFFERED: "1"
  PIP_DISABLE_PIP_VERSION_CHECK: "1"

jobs:
  lint:
    name: lint & typecheck
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt
            constraints.txt
      - name: Install dev deps
        run: pip install -r requirements-dev.txt -c constraints.txt
      - name: ruff
        run: ruff check .
      - name: mypy
        run: mypy

  test:
    name: pytest (sqlite + postgres)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: multi_agent
          POSTGRES_PASSWORD: multi_agent_dev
          POSTGRES_DB: multi_agent
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U multi_agent -d multi_agent"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt
            constraints.txt
      - name: Install dev deps
        run: pip install -r requirements-dev.txt -c constraints.txt
      - name: Show resolved versions
        # 版本漂移是「本地绿、CI 红」的头号原因，先把实际装到的版本打进日志
        run: pip list
      - name: Run tests
        env:
          # conftest 会把 DATABASE_URL 清空走内存 SQLite；
          # 这个变量专门给 test_store_postgres.py 跑真 PG。
          TEST_DATABASE_URL: postgresql://multi_agent:multi_agent_dev@127.0.0.1:5432/multi_agent
          MOCK_LLM: "true"
        run: python -m pytest -p no:cacheprovider -rf --junitxml=reports/junit.xml
      - name: Upload test report
        # 失败时必须有东西可查：以前只看到「Process completed with exit code 1」
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pytest-report
          path: reports/
          retention-days: 7
          if-no-files-found: ignore

  docker:
    name: docker build & smoke
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Validate compose file
        run: docker compose config -q
      - name: Build & start the stack
        # --wait 会等 db 与 app 的 healthcheck 都通过（app 的探针打 /ready）
        run: docker compose up -d --build --wait --wait-timeout 180
      - name: Probe endpoints
        run: |
          set -euo pipefail
          curl -fsS http://127.0.0.1:8000/health
          curl -fsS http://127.0.0.1:8000/ready
          curl -fsS -o /dev/null -w "demo -> %{http_code}\n" http://127.0.0.1:8000/demo
      - name: End-to-end smoke (bootstrap → student → submit → replay)
        # /ready 只能证明「连得上库」。真正会炸的是「迁移建的表能不能承受一次写入」，
        # 所以这里对容器里的真实服务跑一遍完整链路。
        run: python3 scripts/smoke_e2e.py http://127.0.0.1:8000
      - name: Migrations reached head
        # 容器里关闭了 AUTO_APPLY_SCHEMA，表必须来自 alembic；这里顺带验证迁移链
        run: |
          set -euo pipefail
          docker compose exec -T db psql -U multi_agent -d multi_agent -tAc \
            "select version_num from alembic_version" | grep -qx "0004_learners_created_at_default"
      - name: Dump container logs
        if: failure()
        run: docker compose logs --no-color --tail 200
      - name: Tear down
        if: always()
        run: docker compose down -v --remove-orphans